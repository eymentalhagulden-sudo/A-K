<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Usta'nın Mahallesi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
:root{--bg:#0a0d14;--panel:rgba(14,19,30,.82);--line:rgba(150,165,200,.2);--ink:#e8ecf5;--muted:#8a94b0;--amber:#e8a850;--pink:#e8487a;--cyan:#4fc0e8;--good:#6fd498;--bad:#e86060;--display:'Anton','Impact',sans-serif;--body:'Archivo','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:fixed;z-index:2;pointer-events:none}.hud *{pointer-events:auto}
#stats{left:16px;top:calc(12px + env(safe-area-inset-top,0px));width:min(240px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;backdrop-filter:blur(8px)}
#stats h1{font:400 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--amber)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;margin-top:8px}
.row b{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.row span{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--good);border-radius:3px;transition:width .3s,background .3s}
#top-right{right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-variant-numeric:tabular-nums;font-weight:700;backdrop-filter:blur(8px);font-size:13px}
.chip.clock{font:400 18px/1 var(--display);letter-spacing:.06em}
button.ico{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 16px/1 var(--body);cursor:pointer;backdrop-filter:blur(8px)}
#help{right:16px;top:calc(56px + env(safe-area-inset-top,0px));width:min(240px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;line-height:1.5;color:var(--muted);backdrop-filter:blur(8px);font-size:12px}
#help b{color:var(--ink)}
#toast{left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(440px,calc(100vw - 32px));text-align:center;background:rgba(10,14,22,.92);border:1px solid var(--line);border-radius:8px;padding:10px 16px;opacity:0;transition:opacity .25s;pointer-events:none;line-height:1.35;font-size:13px}
#toast.on{opacity:1}
#prompt{left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100vw - 32px))}
.zonename{flex-basis:100%;text-align:center;font:400 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.act{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font:600 13px/1.2 var(--body);cursor:pointer;backdrop-filter:blur(8px)}
.act kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:5px;background:var(--amber);color:#1a1205;font:700 12px/1 var(--body)}
#bubble{position:fixed;z-index:1;pointer-events:none;transform:translate(-50%,-100%);max-width:220px;background:#f5efe4;color:#2b1d12;border-radius:10px;padding:7px 11px;font-weight:600;font-size:12px;line-height:1.35;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
#bubble small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8a3d5c;margin-bottom:3px}
#bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f5efe4}
#stick{left:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(14,19,30,.5);display:none;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(232,168,80,.5);border:1px solid var(--amber)}
@media (pointer:coarse){#stick{display:block}#prompt{bottom:calc(158px + env(safe-area-inset-bottom,0px))}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--amber);font:400 20px/1 var(--display);letter-spacing:.14em;z-index:5;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#cinema{position:fixed;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%);opacity:0;transition:opacity .8s}
#cinema.on{opacity:1}
#cineText{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(640px,calc(100vw - 40px));text-align:center;color:#f5efe4;font:600 16px/1.6 var(--body);text-shadow:0 2px 14px rgba(0,0,0,.95);opacity:0;transition:opacity .5s;pointer-events:none;z-index:5}
#cineText.on{opacity:1}
#cineText small{display:block;font:700 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
#cineHint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s;z-index:5;pointer-events:none}
#cineHint.on{opacity:1}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="stats">
  <h1>Usta Kemal</h1>
  <div class="row"><b>Para</b><span id="vMoney">₺1.200</span></div>
  <div class="row"><b>Elif'in keyfi</b><span id="vMood">70</span><div class="bar"><i id="bMood"></i></div></div>
  <div class="row"><b>Evin erzağı</b><span id="vSup">60</span><div class="bar"><i id="bSup"></i></div></div>
  <div class="row"><b>Ustanın keyfi</b><span id="vFun">50</span><div class="bar"><i id="bFun"></i></div></div>
</div>
<div class="hud" id="top-right">
  <div class="chip clock" id="clock">20:30</div>
  <button class="ico" id="vbtn" title="Bakış (V)">2</button>
  <button class="ico" id="zin">+</button>
  <button class="ico" id="zout">−</button>
  <button class="ico" id="hbtn">?</button>
</div>
<div class="hud" id="help" hidden>
  <b>Yürü:</b> WASD · Shift koş<br>
  <b>Kamera:</b> sürükle / tekerlek<br>
  <b>Bakış:</b> V<br>
  <b>Eylem:</b> bölgede E / F / Q / R<br>
  <b>Sahne:</b> E veya ESC ile bitir
</div>
<div class="hud" id="toast" role="status"></div>
<div class="hud" id="prompt"></div>
<div id="bubble"></div>
<div class="hud" id="stick"><i></i></div>
<div id="loading">MAHALLE YÜKLENİYOR</div>
<div id="cinema"></div>
<div id="cineText"></div>
<div id="cineHint">E veya ESC — sahneyi bitir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var canvas=$('stage');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a2430);
scene.fog=new THREE.Fog(0x1a2430,25,75);
var camera=new THREE.PerspectiveCamera(52,1,0.1,180);

var FY=0.12;
var rects=[];
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o||{}))}
function E(c,i,o){return new THREE.MeshStandardMaterial(Object.assign({color:0x000000,emissive:c,emissiveIntensity:i===undefined?1:i,roughness:0.5},o||{}))}
function B(c,o){return new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}))}
function box(w,h,d,mat,x,y,z,parent,col){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y+h/2,z);
  m.castShadow=true;m.receiveShadow=true;
  (parent||scene).add(m);
  if(col)rects.push([x-w/2,z-d/2,x+w/2,z+d/2]);
  return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,seg){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat);
  m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;
  (parent||scene).add(m);return m;
}
function sph(r,mat,x,y,z,parent){
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
  m.position.set(x,y,z);m.castShadow=true;(parent||scene).add(m);return m;
}
function plane(w,h,mat,x,y,z,ry,rx,parent){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.position.set(x,y,z);m.rotation.y=ry||0;m.rotation.x=rx||0;(parent||scene).add(m);return m;
}
function wall(x1,z1,x2,z2,h,mat,col){return box(x2-x1,h,z2-z1,mat,(x1+x2)/2,FY,(z1+z2)/2,scene,col!==false)}
function cv(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function rnd(a,b){return a+Math.random()*(b-a)}
var glowTex=cv(128,128,function(g,w,h){var r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.4)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
function glow(x,y,z,color,size,op,parent){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));s.position.set(x,y,z);s.scale.set(size,size,1);(parent||scene).add(s);return s}
function signTex(text,sub,o){return cv(o.w,o.h,function(g,w,h){if(o.bg){g.fillStyle=o.bg;g.fillRect(0,0,w,h)}g.textAlign='center';g.textBaseline='middle';if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.blur||24}g.fillStyle=o.fg;g.font=(o.font||'bold 90px Impact,sans-serif');g.fillText(text,w/2,sub?h*0.42:h/2);if(sub){g.font=o.subFont||'bold 28px "Arial Black",sans-serif';g.fillStyle=o.subFg||o.fg;g.fillText(sub,w/2,h*0.8)}if(o.border){g.shadowBlur=o.blur||18;g.strokeStyle=o.border;g.lineWidth=5;g.strokeRect(10,10,w-20,h-20)}})}
function blocked(x,z,r){for(var i=0;i<rects.length;i++){var q=rects[i];var cx=Math.max(q[0],Math.min(x,q[2])),cz=Math.max(q[1],Math.min(z,q[3]));var dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<r*r)return true}return false}

/* ---------- IŞIK ---------- */
scene.add(new THREE.HemisphereLight(0x6a7a9a,0x1a1520,0.7));
var sun=new THREE.DirectionalLight(0xa8b8d8,0.35);
sun.position.set(-20,40,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
var sc=sun.shadow.camera;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=1;sc.far=100;sun.shadow.bias=-0.0005;
scene.add(sun);

/* ---------- ZEMİN: ISLAK DAR SOKAK ---------- */
var asphalt=cv(512,512,function(g,w,h){
  g.fillStyle='#2a2e36';g.fillRect(0,0,w,h);
  for(var i=0;i<2600;i++){var gr=Math.random()*60+50;g.fillStyle='rgba('+gr+','+(gr+2)+','+(gr+8)+','+Math.random()*.3+')';g.fillRect(Math.random()*w,Math.random()*h,2,2)}
  // ıslak yansımalar
  for(var k=0;k<40;k++){g.fillStyle='rgba(80,100,140,'+Math.random()*.15+')';g.fillRect(Math.random()*w,Math.random()*h,Math.random()*40+10,Math.random()*4+1)}
});
asphalt.wrapS=asphalt.wrapT=THREE.RepeatWrapping;asphalt.repeat.set(12,1);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(300,200),M(0x1a1e26));
ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-20);ground.receiveShadow=true;scene.add(ground);
var road=new THREE.Mesh(new THREE.PlaneGeometry(40,7),new THREE.MeshStandardMaterial({map:asphalt,roughness:0.35,metalness:0.15}));
road.rotation.x=-Math.PI/2;road.position.set(0,0.04,2.5);road.receiveShadow=true;scene.add(road);
// kaldırım
box(40,0.14,1.2,M(0x4a4e58),0,0,-1.2,scene,false);
box(40,0.14,1.2,M(0x4a4e58),0,0,6.2,scene,false);
box(40,0.1,0.15,M(0x5a5e68),0,0,0.95,scene,false);

/* ---------- GÖKYÜZÜ ---------- */
var skyTex=cv(256,256,function(g,w,h){
  var gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#5a7a9a');gr.addColorStop(0.5,'#3a4a5e');gr.addColorStop(1,'#1a2430');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
});
var sky=new THREE.Mesh(new THREE.SphereGeometry(150,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
scene.add(sky);

/* ---------- DAR SOKAK: İKİ YANDA YÜKSEK APARTMANLAR ---------- */
function facadeTex(w,h,floors,cols,base,lit){
  var pw=Math.round(w*28),ph=Math.round(h*28);
  var t=cv(pw,ph,function(g,W2,H2){
    g.fillStyle=base;g.fillRect(0,0,W2,H2);
    // sıva dokusu
    for(var s=0;s<400;s++){g.fillStyle='rgba(0,0,0,'+Math.random()*0.05+')';g.fillRect(Math.random()*W2,Math.random()*H2,3,2)}
    var fh=H2/floors,cw=W2/cols;
    for(var f=0;f<floors;f++)for(var c=0;c<cols;c++){
      var x=c*cw+cw*0.2,y=f*fh+fh*0.22,ww=cw*0.6,hh=fh*0.55;
      var on=Math.random()<lit;
      g.fillStyle=on?(Math.random()>0.4?'#f5d090':'#a8c8e8'):'#0e1218';
      g.fillRect(x,y,ww,hh);
      g.strokeStyle='rgba(20,20,25,.9)';g.lineWidth=2;g.strokeRect(x,y,ww,hh);
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+ww/2-1,y,2,hh);
      if(Math.random()>0.7){g.fillStyle='rgba(200,200,210,.4)';g.fillRect(x-4,y+hh*0.4,ww+8,hh*0.08)}
    }
    // balkon demirleri
    for(var fb=0;fb<floors;fb++){g.fillStyle='rgba(0,0,0,.15)';g.fillRect(0,fb*fh+fh*0.85,W2,fh*0.08)}
  });
  t.minFilter=THREE.LinearFilter;return t;
}
function alleyBlock(x,w,floors,side){
  var fh=3.2,H=floors*fh,d=10;
  var tex=facadeTex(w,H,floors,Math.max(2,Math.round(w/2.2)),side>0?'#8a7a6a':'#7a6a5a',0.5);
  var sideM=M(0x3a3430),roof=M(0x1a1816);
  var front=new THREE.MeshStandardMaterial({map:tex,color:0xd0d0d8,roughness:0.85});
  var mats=[sideM,sideM,roof,roof,side>0?sideM:front,side>0?front:sideM];
  var z0=side>0?-1.4:6.4;
  var z1=side>0?z0-d:z0+d;
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,H,d),mats);
  m.position.set(x,H/2,(z0+z1)/2);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  rects.push([x-w/2,Math.min(z0,z1),x+w/2,Math.max(z0,z1)]);
  // balkonlar
  var n=Math.max(2,Math.floor(w/3.5));
  for(var f=1;f<floors;f++)for(var c=0;c<n;c++){
    var bx=x-w/2+(c+0.5)*(w/n),by=f*fh+0.05;
    var dir=side>0?-1:1;
    box(1.6,0.1,0.7,M(0x5a5a60),bx,by,z0+dir*0.35,scene,false);
    box(1.6,0.6,0.04,M(0x3a3a40),bx,by+0.1,z0+dir*0.75,scene,false);
    // uydu anteni
    if((f+c)%3===0){
      var dish=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,6,0,Math.PI*2,0,Math.PI*0.5),M(0xe0dcd0,{roughness:0.7}));
      dish.position.set(bx-0.4,by+0.75,z0+dir*0.9);dish.rotation.x=-dir*1.4;dish.rotation.z=0.3;scene.add(dish);
    }
    // klima
    if((f*2+c)%4===1){
      box(0.55,0.35,0.28,M(0xd0d0c8,{roughness:0.6}),bx+0.6,by+0.4,z0+dir*0.2,scene,false);
      for(var v=0;v<4;v++)box(0.4,0.02,0.02,M(0x888888),bx+0.6,by+0.45+v*0.06,z0+dir*0.35,scene,false);
    }
    // çamaşır ipi + kıyafet
    if((f+c*2)%5===2){
      var cols=[0xe85a5a,0xf0f0f0,0x5a8ae8,0xf0c040,0x6fd498];
      for(var ci=0;ci<4;ci++)box(0.35,0.5,0.02,M(cols[ci]),bx-0.7+ci*0.42,by+0.5,z0+dir*0.7,scene,false);
      box(1.6,0.015,0.015,M(0x888888),bx,by+1.0,z0+dir*0.7,scene,false);
    }
  }
}
// sol yan (fotoğraftaki sol bina) - kırmızımsı, daha eski
alleyBlock(-9,8,7,-1);
alleyBlock(-18,7,6,-1);
alleyBlock(-26,8,7,-1);
// sağ yan - daha açık renk, daha bakımlı
alleyBlock(9,8,7,1);
alleyBlock(18,7,6,1);
alleyBlock(26,8,7,1);

// sokak sonu (uzaktaki bina)
block(0,10,8,{z0:0,d:12,base:'#5a4a3a',lit:0.4});
function block(x,w,floors,o){
  var fh=3.2,H=floors*fh,d=o.d||10;
  var tex=facadeTex(w,H,floors,Math.max(2,Math.round(w/2.5)),o.base||'#5a4a3a',o.lit||0.4);
  var sideM=M(0x3a3430),roof=M(0x1a1816);
  var front=new THREE.MeshStandardMaterial({map:tex,color:0xc8c8d0,roughness:0.85});
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,H,d),[sideM,sideM,roof,roof,front,front]);
  m.position.set(x,H/2,o.z0-d/2);m.castShadow=true;scene.add(m);
  rects.push([x-w/2,o.z0-d,x+w/2,o.z0]);
}

/* ---------- ELEKTRİK KABLOLARI (fotoğraftaki gibi) ---------- */
var cableMat=M(0x0a0a0a,{roughness:0.9});
function cable(x1,y1,z1,x2,y2,z2,sag){
  var pts=[];
  for(var i=0;i<=10;i++){
    var t=i/10;
    var x=x1+(x2-x1)*t;
    var y=y1+(y2-y1)*t - Math.sin(t*Math.PI)*(sag||0.8);
    var z=z1+(z2-z1)*t;
    pts.push(new THREE.Vector3(x,y,z));
  }
  var curve=new THREE.CatmullRomCurve3(pts);
  var geo=new THREE.TubeGeometry(curve,20,0.025,6,false);
  var m=new THREE.Mesh(geo,cableMat);scene.add(m);
}
// sokak boyunca kablolar
cable(-8,7,-1,8,7,-1,0.4);
cable(-8,7.5,-1,8,7.5,-1,0.5);
cable(-8,7,6.4,8,7,6.4,0.3);
cable(-8,6.5,2,8,6.5,2,0.6);
cable(-8,7.2,-1,-8,7.2,6.4,0.5);
cable(8,7.2,-1,8,7.2,6.4,0.5);
// direk
cyl(0.08,0.1,7.5,M(0x2a2e36),-6,0,1.2,scene,10);
box(1.5,0.06,0.06,M(0x2a2e36),-6,7.2,1.2,scene,false);

  } else if(o.hair){

    if(style==='short'||style==='long'){

    if(!longSleeve){}

function walkPose(p,ph,amp){for(var i=0;i<2;i++){var q=ph+(i?Math.PI:0),s=Math.sin(q);p.legs[i].rotation.x=s*amp;p.shins[i].rotation.x=Math.max(0,Math.cos(q))*amp*1.4;p.arms[i].rotation.x=-s*amp*0.75;p.elbows[i].rotation.x=-0.25-Math.max(0,-Math.cos(q))*0.5*amp}}
function relaxPose(p,k){for(var i=0;i<2;i++){p.legs[i].rotation.x*=k;p.shins[i].rotation.x*=k;p.arms[i].rotation.x*=k;p.elbows[i].rotation.x+=(-0.15-p.elbows[i].rotation.x)*(1-k)}}
function kissPose(p1,p2,k){
  // iki karakteri yakınlaştır, kafaları hafif yana eğ
  var mid=p1.g.position.clone().add(p2.g.position).multiplyScalar(0.5);
  var dx=p2.g.position.x-p1.g.position.x,dz=p2.g.position.z-p1.g.position.z;
  var dist=Math.hypot(dx,dz)||1;
  p1.g.position.x=mid.x-dx/dist*0.35;
  p1.g.position.z=mid.z-dz/dist*0.35;
  p2.g.position.x=mid.x+dx/dist*0.35;
  p2.g.position.z=mid.z+dz/dist*0.35;
  p1.g.rotation.y=Math.atan2(dx,dz);
  p2.g.rotation.y=Math.atan2(-dx,-dz);
  p1.head.rotation.z=0.15*k;p2.head.rotation.z=-0.15*k;
  p1.head.rotation.x=0.25*k;p2.head.rotation.x=0.25*k;
}

function cineShow(){

function cineNext(){

function cineEnd(){

function cineCamera(seq,idx,total){
  var prog=idx/Math.max(1,total-1);
  if(seq===SCENES.house_talk){
    return {
      pos:new THREE.Vector3(HOUSE.x+2.5-prog*0.5, 1.7+prog*0.2, 2.5-prog*1.2),
      look:new THREE.Vector3(W.g.position.x, 1.5, W.g.position.z)
    };
  }
  if(seq===SCENES.house_kiss){
    var c=Math.cos(prog*Math.PI*0.8);
    return {
      pos:new THREE.Vector3(W.g.position.x+1.2*c, 1.65, W.g.position.z+1.5-Math.sin(prog*Math.PI)*0.5),
      look:new THREE.Vector3(W.g.position.x, 1.55, W.g.position.z)
    };
  }
  if(seq===SCENES.house_intimate){
    return {
      pos:new THREE.Vector3(W.g.position.x+Math.cos(prog*Math.PI)*1.8, 1.5+Math.sin(prog*Math.PI)*0.4, W.g.position.z+2.0-prog*1.4),
      look:new THREE.Vector3(W.g.position.x, 1.35, W.g.position.z)
    };
  }
  if(seq===SCENES.club_drink||seq===SCENES.club_dance){
    var t=tt*0.25;
    return {
      pos:new THREE.Vector3(CLUB.x+Math.sin(t)*2.5, 2.2+Math.sin(t*1.7)*0.3, CLUB.z+3+Math.cos(t)*1.5),
      look:new THREE.Vector3(CLUB.x, 1.5, CLUB.z-1.5)
    };
  }
  if(seq===SCENES.club_vip){
    return {
      pos:new THREE.Vector3(CLUB.x-2.5, 1.9+prog*0.2, CLUB.z+1.5-prog*1),
      look:new THREE.Vector3(CLUB.x, 1.4, CLUB.z-1)
    };
  }
  return null;
}
function cinePose(seq,idx){
  var step=(idx+1)/Math.max(1,seq.length);
  if(seq===SCENES.house_talk){
    // Elif kafayı hafif çevirir, eli karnında
    W.head.rotation.y=Math.sin(tt*0.7)*0.15;
  }
  if(seq===SCENES.house_kiss){
    // yaklaş, kafalar yana eğ
    var dx=W.g.position.x-P.g.position.x;
    var dz=W.g.position.z-P.g.position.z;
    P.g.position.x=W.g.position.x-dx*0.15;
    P.g.position.z=W.g.position.z-dz*0.15;
    P.g.rotation.y=Math.atan2(dx,dz);
    W.g.rotation.y=Math.atan2(-dx,-dz);
    var k=Math.min(1,idx/3);
    P.head.rotation.z=0.1*k;
    P.head.rotation.x=0.2*k;
    W.head.rotation.z=-0.1*k;
    W.head.rotation.x=0.2*k;
    // kollar sarılır
    P.arms[0].rotation.x=-1.2*k;
    P.arms[1].rotation.x=-1.2*k;
    P.elbows[0].rotation.x=-1.4*k;
    P.elbows[1].rotation.x=-1.4*k;
    W.arms[0].rotation.x=-1.0*k;
    W.arms[1].rotation.x=-1.0*k;
  }
  if(seq===SCENES.house_intimate){
    var k=Math.min(1,idx/4);
    P.g.position.x=W.g.position.x-0.3;
    P.g.position.z=W.g.position.z+0.3;
    P.g.rotation.y=Math.atan2(W.g.position.x-P.g.position.x,W.g.position.z-P.g.position.z);
    W.g.rotation.y=Math.atan2(P.g.position.x-W.g.position.x,P.g.position.z-W.g.position.z);
    P.head.rotation.x=0.3*k;
    W.head.rotation.x=0.25*k;
    P.arms[0].rotation.x=-1.5*k;P.arms[1].rotation.x=-1.5*k;
    W.arms[0].rotation.x=-1.2*k;W.arms[1].rotation.x=-1.2*k;
    W.head.rotation.z=Math.sin(tt*1.2)*0.08;
  }
}

var clock=new THREE.Clock(),tt=0,walkPh=0;
var hsl=new THREE.Color();
var proj=new THREE.Vector3();
function frame(){
  var dt=Math.min(clock.getDelta(),0.05);tt+=dt;

  // sinematik
  if(CINE.active){
    CINE.t+=dt;
    cinePose(CINE.seq,CINE.idx);
    var camCue=cineCamera(CINE.seq,CINE.idx,CINE.seq.length);
    if(camCue){
      camera.position.lerp(camCue.pos,Math.min(1,dt*1.8));
      camLook.lerp(camCue.look,Math.min(1,dt*1.8));
      camera.lookAt(camLook);
    }
    if(CINE.t>4.5)cineNext();
    // Elif idle detay
    W.g.position.y=FY+Math.sin(tt*1.2)*0.008;
    if(CINE.seq===SCENES.house_talk){W.head.rotation.z=Math.sin(tt*0.9)*0.06}
    // neon titret
    if(window.__neon)window.__neon.material.color.setScalar(0.85+Math.sin(tt*3)*0.15);
    npcUpdate(dt,tt);
    hud();
    if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on')}
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
    return;
  }

  // hareket
  var ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
  var iy=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)+joy.y;
  var il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  var moving=il>0.08;
  if(moving){
    var sp3=(keys['shift']?6:4)*dt;
    var fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    var mx=(fx*iy+rx*ix),mz=(fz*iy+rz*ix);
    var nx=P.g.position.x+mx*sp3,nz=P.g.position.z+mz*sp3;
    if(!blocked(nx,P.g.position.z,0.3))P.g.position.x=clamp(nx,-30,30);
    if(!blocked(P.g.position.x,nz,0.3))P.g.position.z=clamp(nz,-1.2,6);
    var ta=Math.atan2(mx,mz),da=ta-P.g.rotation.y;
    da=Math.atan2(Math.sin(da),Math.cos(da));P.g.rotation.y+=da*Math.min(1,dt*12);
    walkPh+=dt*(keys['shift']?11:8);
    walkPose(P,walkPh,keys['shift']?0.9:0.65);
  }else{
    relaxPose(P,0.8);
  }

  // bölge
  var nz2=null;
  for(var zi=0;zi<ZONES.length;zi++){var z=ZONES[zi];if(Math.hypot(P.g.position.x-z.x,P.g.position.z-z.z)<z.r){nz2=z;break}}
  if(nz2!==curZone){curZone=nz2;renderPrompt(curZone)}

  // zaman/ihtiyaç
  S.min+=dt*0.8;
  S.mood=clamp(S.mood-dt*0.11,0,100);S.sup=clamp(S.sup-dt*0.13,0,100);S.fun=clamp(S.fun-dt*0.09,0,100);
  if(tt-lastWarn>25){
    if(S.mood<20){toast('Elif\'in morali çok düşük. Yanına git.');lastWarn=tt}
    else if(S.sup<15){toast('Evde yiyecek kalmadı.');lastWarn=tt}
  }
  hud();
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on')}

  // Elif idle
  W.g.position.y=FY+Math.sin(tt*1.4)*0.008;
  var dxw=P.g.position.x-W.g.position.x, dzw=P.g.position.z-W.g.position.z;
  var dW=Math.hypot(dxw,dzw);
  if(dW<5)W.g.rotation.y=Math.atan2(dxw,dzw);
  W.elbows[0].rotation.x=-1.6+Math.sin(tt*1.8)*0.03;
  W.elbows[1].rotation.x=-1.6+Math.sin(tt*1.8)*0.03;
  W.head.rotation.z=Math.sin(tt*0.9)*0.05;
  // bubble
  var bubble=$('bubble');
  if(dW<6){
    proj.set(W.g.position.x,FY+2.45,W.g.position.z).project(camera);
    bubble.style.left=((proj.x+1)/2*window.innerWidth)+'px';
    bubble.style.top=((1-proj.y)/2*window.innerHeight)+'px';
    var line=S.sup<28?'Buzdolabı boşalmış. Markete uğrasan mı?':S.mood<28?'Bu saatte hâlâ dışarıda mısın?':S.mood<55?'Bebek bugün çok tepindi. Gelsen yanıma.':S.mood<80?'İyiyim. Sen yorulma, ustam.':'Sen varsın ya, hiç korkmuyorum.';
    bubble.innerHTML='<small>Elif</small>'+line;
    bubble.style.opacity=proj.z<1?1:0;
  }else bubble.style.opacity=0;

  // neon titret
  if(window.__neon)window.__neon.material.color.setScalar(0.85+Math.sin(tt*2.5)*0.12);

  npcUpdate(dt,tt);

  pitch+=(pitchT-pitch)*Math.min(1,dt*6);
  placeCam(dt,false);
  dist+=(distT-dist)*Math.min(1,dt*6);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
renderPrompt(null);hud();
setTimeout(function(){$('loading').classList.add('off');toast('Mahalleye hoş geldin. WASD ile yürü, evin önüne git.')},400);
frame();

})();
</script>
