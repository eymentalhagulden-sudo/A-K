<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Meter 2026 | Aşkını Ölç</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff2e63;
            --dark: #080808;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dark);
            background-image: radial-gradient(circle at 50% -20%, #4d001a, transparent);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ANA KART */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff2e63, #ff82a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 30px;
        }

        /* INPUT GRUPLARI */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--pink);
            background: rgba(255, 46, 99, 0.05);
        }

        .heart-icon {
            font-size: 30px;
            margin: 10px 0;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* BUTON */
        .calc-btn {
            width: 100%;
            background: var(--pink);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 46, 99, 0.3);
            margin-top: 10px;
        }

        .calc-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 46, 99, 0.5);
        }

        /* SONUÇ EKRANI */
        #result-box {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .percentage {
            font-size: 60px;
            font-weight: 800;
            color: var(--pink);
            margin-bottom: 10px;
        }

        .message {
            font-size: 16px;
            line-height: 1.5;
            color: #ddd;
        }

        /* DEKORATİF KALPLER */
        .bg-heart {
            position: absolute;
            z-index: -1;
            opacity: 0.1;
            filter: blur(2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aşk Ölçer <span>2026</span></h1>
        <p class="subtitle">Gerçek aşkını keşfetmeye hazır mısın?</p>

        <div id="main-ui">
            <div class="input-group">
                <input type="text" id="name1" placeholder="Senin Adın" autocomplete="off">
            </div>

            <div class="heart-icon">❤️</div>

            <div class="input-group">
                <input type="text" id="name2" placeholder="Onun Adı" autocomplete="off">
            </div>

            <button class="calc-btn" onclick="checkLove()">AŞKINI ÖLÇ</button>
        </div>

        <div id="result-box">
            <div class="percentage" id="percent">0%</div>
            <div class="message" id="msg">Analiz ediliyor...</div>
            <button class="calc-btn" style="background:transparent; border: 1px solid var(--pink); margin-top:20px;" onclick="reset()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        function checkLove() {
            const n1 = document.getElementById('name1').value.trim();
            const n2 = document.getElementById('name2').value.trim();

            if (n1 === "" || n2 === "") {
                alert("Lütfen iki ismi de yaz kk!");
                return;
            }

            // Arayüzü değiştir
            document.getElementById('main-ui').style.display = "none";
            document.getElementById('result-box').style.display = "block";

            // Rastgele ama isme bağlı gibi hissettiren bir sayı üretelim
            const score = Math.floor(Math.random() * 101);
            
            // Animasyonlu sayı artışı
            let current = 0;
            const interval = setInterval(() => {
                if (current >= score) {
                    clearInterval(interval);
                    showFinalMessage(score);
                } else {
                    current++;
                    document.getElementById('percent').innerText = current + "%";
                }
            }, 20);
        }

        function showFinalMessage(score) {
            const msg = document.getElementById('msg');
            if (score > 85) {
                msg.innerText = "Vay canına! Siz birbiriniz için yaratılmışsınız. Hemen bir yüzük bakmaya başla! 💍🔥";
            } else if (score > 60) {
                msg.innerText = "Baya bi kıvılcım var! Bir kahve içmeye gitseniz bu iş olur gibi. 😉☕";
            } else if (score > 40) {
                msg.innerText = "Fena değil, ama biraz daha çabalaman lazım kk. Pes etme! 💪";
            } else if (score > 20) {
                msg.innerText = "Yani... Arkadaş kalsanız daha iyi sanki? Ama sen bilirsin tabii. 😶";
            } else {
                msg.innerText = "Hemen uzaklaş! Bu aşk değil, başka bir şey... Koşarak kaç! 💀🏃‍♂️";
            }
        }

        function reset() {
            document.getElementById('name1').value = "";
            document.getElementById('name2').value = "";
            document.getElementById('main-ui').style.display = "block";
            document.getElementById('result-box').style.display = "none";
            document.getElementById('percent').innerText = "0%";
        }
    </script>
</body>
</html>
