<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Meter 2026 | Wedding Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pink: #ff2e63; --dark: #080808; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dark);
            background-image: radial-gradient(circle at 50% -20%, #4d001a, transparent);
            color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden;
        }
        .container {
            width: 100%; max-width: 450px; padding: 30px; background: var(--glass);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 25px; background: linear-gradient(to right, #ff2e63, #ff82a3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input {
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255, 255, 255, 0.05);
            padding: 18px; border-radius: 20px; color: white; font-size: 16px; outline: none; transition: 0.3s; text-align: center; margin-bottom: 15px;
        }
        input:focus { border-color: var(--pink); }
        .calc-btn {
            width: 100%; background: var(--pink); color: white; border: none; padding: 18px; border-radius: 20px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 46, 99, 0.3);
        }
        #result-box { display: none; margin-top: 20px; animation: fadeIn 0.8s ease; }
        .percentage { font-size: 80px; font-weight: 900; color: var(--pink); text-shadow: 0 0 30px #ff2e63; }
        .video-container { margin-top: 20px; border-radius: 20px; overflow: hidden; display: none; border: 2px solid var(--pink); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aşk Ölçer <span>2026</span></h1>

        <div id="main-ui">
            <input type="text" id="name1" placeholder="İsim 1" autocomplete="off">
            <div style="font-size: 24px; margin: 10px;">❤️</div>
            <input type="text" id="name2" placeholder="İsim 2" autocomplete="off">
            <button class="calc-btn" onclick="checkLove()">AŞKINI ÖLÇ</button>
        </div>

        <div id="result-box">
            <div class="percentage" id="percent">%0</div>
            <div id="msg" style="margin-top: 15px; font-weight: 800; font-size: 20px;"></div>
            
            <!-- Video Alanı -->
            <div class="video-container" id="vid-frame">
                <iframe width="100%" height="250" src="" id="yt-video" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <button class="calc-btn" style="background:transparent; border: 1px solid var(--pink); margin-top:25px;" onclick="location.reload()">YENİDEN DENE</button>
        </div>
    </div>

    <script>
        function checkLove() {
            let n1 = document.getElementById('name1').value.trim().toLowerCase();
            let n2 = document.getElementById('name2').value.trim().toLowerCase();

            if (!n1 || !n2) return alert("İsimleri gir kk!");

            document.getElementById('main-ui').style.display = "none";
            document.getElementById('result-box').style.display = "block";

            let percentEl = document.getElementById('percent');
            let msgEl = document.getElementById('msg');
            let vidFrame = document.getElementById('vid-frame');
            let ytVideo = document.getElementById('yt-video');

            // MUSA & ZOKTAY ÖZEL DURUMU
            const isWedding = (
                (n1 === "musa" && n2 === "zoktay") || 
                (n1 === "zoktay" && n2 === "musa")
            );

            if (isWedding) {
                // Sonsuzluk işareti
                percentEl.innerHTML = "&infin;"; 
                msgEl.innerHTML = "<span style='color:#ff2e63;'>EBEDİ AŞK BULUNDU!</span><br>SİZ EVLENMELİSİNİZ 💍";
                
                // Konfeti Yağmuru
                var duration = 5 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    var particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
                }, 250);

                // Video Göster (Örnek bir düğün/romantik müzik videosu)
                vidFrame.style.display = "block";
                ytVideo.src = "https://www.youtube.com/embed/0mP3_T79UAc?autoplay=1"; // Buraya istediğin video ID'sini koyabilirsin

            } else {
                // Normal Hesaplama
                let score = Math.floor(Math.random() * 101);
                let current = 0;
                let timer = setInterval(() => {
                    if (current >= score) {
                        clearInterval(timer);
                        msgEl.innerText = score > 70 ? "Vay be! 😍" : "Daha çok fırın ekmek yemeniz lazım.. 💀";
                    } else {
                        current++;
                        percentEl.innerText = "%" + current;
                    }
                }, 20);
            }
        }
    </script>
</body>
</html>
