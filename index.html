<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Usta'nın Mahallesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0b1020;--panel:rgba(14,19,40,.78);--line:rgba(160,175,230,.22);
  --ink:#eef0ff;--muted:#9aa5cf;--amber:#ffb454;--pink:#ff4fa3;--cyan:#4fd8ff;
  --good:#6fe3a0;--warn:#ffb454;--bad:#ff6b6b;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Archivo','Segoe UI',system-ui,sans-serif;color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:fixed;z-index:2;pointer-events:none}
.hud *{pointer-events:auto}
#stats{left:16px;top:calc(12px + env(safe-area-inset-top,0px));width:min(250px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px)}
#stats h1{font:400 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--amber)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;margin-top:8px}
.row b{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.row span{font-variant-numeric:tabular-nums;font-weight:700}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--good);border-radius:3px;transition:width .3s,background .3s}
#top-right{right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums;font-weight:700;backdrop-filter:blur(6px)}
.chip.clock{font:400 20px/1 var(--display);letter-spacing:.08em}
button.ico{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 18px/1 var(--body);cursor:pointer;backdrop-filter:blur(6px)}
button.ico:focus-visible,.act:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#help{right:16px;top:calc(62px + env(safe-area-inset-top,0px));width:min(260px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.5;color:var(--muted);backdrop-filter:blur(6px)}
#help b{color:var(--ink)}
#toast{left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(460px,calc(100vw - 32px));text-align:center;background:rgba(10,14,30,.9);border:1px solid var(--line);border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .25s;pointer-events:none;line-height:1.35}
#toast.on{opacity:1}
#prompt{left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100vw - 32px))}
.zonename{flex-basis:100%;text-align:center;font:400 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.act{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--ink);font:600 14px/1.2 var(--body);cursor:pointer;backdrop-filter:blur(6px)}
.act kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--amber);color:#1a1205;font:700 13px/1 var(--body)}
#bubble{position:fixed;z-index:1;pointer-events:none;transform:translate(-50%,-100%);max-width:200px;background:#fff7ee;color:#2b1d12;border-radius:12px;padding:7px 11px;font-weight:600;font-size:12.5px;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
#bubble small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a0522d;margin-bottom:2px}
#bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff7ee}
#stick{left:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:1px solid var(--line);background:rgba(14,19,40,.45);display:none;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,180,84,.55);border:1px solid var(--amber)}
@media (pointer:coarse){#stick{display:block}#prompt{bottom:calc(168px + env(safe-area-inset-bottom,0px))}}
@media (max-width:520px){#top-right{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 236px)}#stats{width:200px;padding:10px 12px}#stats h1{font-size:16px}.row{margin-top:6px}#top-right .chip.money{display:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--amber);font:400 22px/1 var(--display);letter-spacing:.12em;z-index:5;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#cinema{position:fixed;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%);opacity:0;transition:opacity .8s}
#cinema.on{opacity:1}
#cineText{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(680px,calc(100vw - 40px));text-align:center;color:#fff;font:600 17px/1.6 var(--body);text-shadow:0 2px 12px rgba(0,0,0,.9);opacity:0;transition:opacity .5s;pointer-events:none;z-index:5}
#cineText.on{opacity:1}
#cineText small{display:block;font:700 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
#cineHint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s;z-index:5;pointer-events:none}
#cineHint.on{opacity:1}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="stats">
  <h1>Usta Kemal</h1>
  <div class="row"><b>Para</b><span id="vMoney">₺1.200</span></div>
  <div class="row"><b>Elif'in keyfi</b><span id="vMood">70</span><div class="bar"><i id="bMood"></i></div></div>
  <div class="row"><b>Evin erzağı</b><span id="vSup">60</span><div class="bar"><i id="bSup"></i></div></div>
  <div class="row"><b>Ustanın keyfi</b><span id="vFun">50</span><div class="bar"><i id="bFun"></i></div></div>
</div>
<div class="hud" id="top-right">
  <div class="chip clock" id="clock">20:30</div>
  <button class="ico" id="vbtn" title="Bakış (V)">2</button>
  <button class="ico" id="zin">+</button>
  <button class="ico" id="zout">−</button>
  <button class="ico" id="hbtn">?</button>
</div>
<div class="hud" id="help" hidden>
  <b>Yürü:</b> W A S D (Shift: koş)<br>
  <b>Kamera:</b> sürükle, tekerlekle yakınlaş<br>
  <b>Bakış:</b> V (1: üstten, 2: sokak)<br>
  <b>Eylem:</b> bölgedeyken E / F / Q<br>
  <b>Sahne:</b> E veya ESC ile bitir
</div>
<div class="hud" id="toast" role="status"></div>
<div class="hud" id="prompt"></div>
<div id="bubble"></div>
<div class="hud" id="stick"><i></i></div>
<div id="loading">MAHALLE YÜKLENİYOR</div>
<div id="cinema"></div>
<div id="cineText"></div>
<div id="cineHint">E veya ESC — sahneyi bitir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var canvas=$('stage');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
scene.fog=new THREE.Fog(0x0b1020,42,95);
var camera=new THREE.PerspectiveCamera(48,1,0.1,220);

var T=0.3, ZF=-2, FY=0.12;
var rects=[];
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.82,metalness:0},o||{}))}
function E(c,i,o){return new THREE.MeshStandardMaterial(Object.assign({color:0x000000,emissive:c,emissiveIntensity:i===undefined?1:i,roughness:0.5},o||{}))}
function B(c,o){return new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}))}
function box(w,h,d,mat,x,y,z,parent,col,noShadow){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y+h/2,z);
  if(!noShadow)m.castShadow=true;
  m.receiveShadow=true;
  (parent||scene).add(m);
  if(col)rects.push([x-w/2,z-d/2,x+w/2,z+d/2]);
  return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,seg){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat);
  m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;
  (parent||scene).add(m);return m;
}
function sph(r,mat,x,y,z,parent,seg){
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,seg||16,12),mat);
  m.position.set(x,y,z);m.castShadow=true;(parent||scene).add(m);return m;
}
function plane(w,h,mat,x,y,z,ry,rx,parent){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.position.set(x,y,z);m.rotation.y=ry||0;m.rotation.x=rx||0;(parent||scene).add(m);return m;
}
function wall(x1,z1,x2,z2,h,mat,col){return box(x2-x1,h,z2-z1,mat,(x1+x2)/2,FY,(z1+z2)/2,scene,col!==false)}
function cv(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function rnd(a,b){return a+Math.random()*(b-a)}
var glowTex=cv(128,128,function(g,w,h){var r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
function glow(x,y,z,color,size,op,parent){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));s.position.set(x,y,z);s.scale.set(size,size,1);(parent||scene).add(s);return s}
function signTex(text,sub,o){return cv(o.w,o.h,function(g,w,h){if(o.bg){g.fillStyle=o.bg;g.fillRect(0,0,w,h)}g.textAlign='center';g.textBaseline='middle';if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.blur||24}g.fillStyle=o.fg;g.font=(o.font||'bold 90px Impact,"Arial Black",sans-serif');g.fillText(text,w/2,sub?h*0.42:h/2);if(sub){g.font=o.subFont||'bold 30px "Arial Black",sans-serif';g.fillStyle=o.subFg||o.fg;g.fillText(sub,w/2,h*0.8)}if(o.border){g.shadowBlur=o.blur||18;g.strokeStyle=o.border;g.lineWidth=6;g.strokeRect(10,10,w-20,h-20)}})}
function blocked(x,z,r){for(var i=0;i<rects.length;i++){var q=rects[i];var cx=Math.max(q[0],Math.min(x,q[2])),cz=Math.max(q[1],Math.min(z,q[3]));var dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<r*r)return true}return false}

scene.add(new THREE.HemisphereLight(0x7f93d0,0x2a2038,0.95));
var moon=new THREE.DirectionalLight(0xa9bcff,0.55);
moon.position.set(-14,34,22);moon.castShadow=true;
moon.shadow.mapSize.set(3072,3072);
var sc=moon.shadow.camera;sc.left=-58;sc.right=58;sc.top=38;sc.bottom=-34;sc.near=1;sc.far=90;moon.shadow.bias=-0.0006;
scene.add(moon);

var asphalt=cv(512,512,function(g,w,h){g.fillStyle='#232733';g.fillRect(0,0,w,h);for(var i=0;i<2600;i++){g.fillStyle='rgba('+(60+Math.random()*40|0)+','+(60+Math.random()*40|0)+','+(70+Math.random()*40|0)+','+Math.random()*.25+')';g.fillRect(Math.random()*w,Math.random()*h,2,2)}});
asphalt.wrapS=asphalt.wrapT=THREE.RepeatWrapping;asphalt.repeat.set(26,1.2);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(260,160),M(0x1c2230));
ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-30);ground.receiveShadow=true;scene.add(ground);
var road=new THREE.Mesh(new THREE.PlaneGeometry(130,6.4),new THREE.MeshStandardMaterial({map:asphalt,roughness:0.95}));
road.rotation.x=-Math.PI/2;road.position.set(-2,0.04,3.8);road.receiveShadow=true;scene.add(road);
for(var li=-30;li<28;li+=4){plane(2,0.16,B(0xd8d2a8),li,0.06,3.8,0,-Math.PI/2)}
box(130,0.12,2.2,M(0x4a4f63),-2,0,-0.9,scene,false,true);
box(130,0.12,1.2,M(0x4a4f63),-2,0,7.6,scene,false,true);
box(130,0.16,0.2,M(0x5b6078),-2,0,0.35,scene,false,true);

var winTex=cv(256,256,function(g,w,h){g.fillStyle='#10152b';g.fillRect(0,0,w,h);for(var y=10;y<h;y+=26)for(var x=10;x<w;x+=26){var on=Math.random()>.55;g.fillStyle=on?(Math.random()>.5?'#ffd98a':'#9fd0ff'):'#161c38';g.fillRect(x,y,14,16)}});
winTex.wrapS=winTex.wrapT=THREE.RepeatWrapping;
for(var bi=0;bi<12;bi++){var bw=rnd(8,14),bh=rnd(10,26),bx=-52+bi*10.5+rnd(-2,2);var tex=winTex.clone();tex.needsUpdate=true;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(bw/6,bh/6);var bm=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,8),new THREE.MeshBasicMaterial({map:tex,color:0xb8c0e8}));bm.position.set(bx,bh/2,-34);scene.add(bm)}
var stars=new THREE.BufferGeometry(),sp=[];
for(var si=0;si<420;si++){var a=rnd(0,Math.PI*2),e=rnd(.15,1.2),rr=120;sp.push(Math.cos(a)*Math.cos(e)*rr,Math.sin(e)*rr*.8+25,Math.sin(a)*Math.cos(e)*rr)}
stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xdfe6ff,size:0.7,sizeAttenuation:false,fog:false})));
var moonMesh=new THREE.Mesh(new THREE.SphereGeometry(4,24,16),new THREE.MeshBasicMaterial({color:0xf2f0dc,fog:false}));
moonMesh.position.set(-48,52,-100);scene.add(moonMesh);
glow(-48,52,-100,0xaabbff,34,0.45);
