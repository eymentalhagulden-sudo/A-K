<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Meter 2026 | Özel Versiyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff2e63;
            --dark: #080808;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dark);
            background-image: radial-gradient(circle at 50% -20%, #4d001a, transparent);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(to right, #ff2e63, #ff82a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            margin-bottom: 15px;
        }

        input:focus { border-color: var(--pink); }

        .calc-btn {
            width: 100%;
            background: var(--pink);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 46, 99, 0.3);
        }

        #result-box {
            display: none;
            margin-top: 30px;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .percentage {
            font-size: 70px;
            font-weight: 900;
            color: var(--pink);
            text-shadow: 0 0 30px rgba(255, 46, 99, 0.8);
        }

        /* PATLAMA EFEKTİ İÇİN */
        .boom {
            animation: shake 0.2s infinite;
            color: #fff !important;
            text-shadow: 0 0 50px #ff2e63, 0 0 100px #ff2e63 !important;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aşk Ölçer <span>2026</span></h1>

        <div id="main-ui">
            <input type="text" id="name1" placeholder="İsim 1" autocomplete="off">
            <div style="font-size: 24px; margin: 10px;">❤️</div>
            <input type="text" id="name2" placeholder="İsim 2" autocomplete="off">
            <button class="calc-btn" onclick="checkLove()">AŞKINI ÖLÇ</button>
        </div>

        <div id="result-box">
            <div class="percentage" id="percent">%0</div>
            <div id="msg" style="margin-top: 15px; font-weight: 600;"></div>
            <button class="calc-btn" style="background:transparent; border: 1px solid var(--pink); margin-top:30px;" onclick="location.reload()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        function checkLove() {
            let n1 = document.getElementById('name1').value.trim().toLowerCase();
            let n2 = document.getElementById('name2').value.trim().toLowerCase();

            if (!n1 || !n2) return alert("İsimleri boş bırakma kk!");

            document.getElementById('main-ui').style.display = "none";
            document.getElementById('result-box').style.display = "block";

            let percentEl = document.getElementById('percent');
            let msgEl = document.getElementById('msg');

            // ÖZEL Easter Egg: Musa ve Impex kontrolü
            const isSpecial = (
                (n1 === "musa" && n2 === "impex") || 
                (n1 === "impex" && n2 === "musa")
            );

            if (isSpecial) {
                // Gösterge patlıyor!
                percentEl.innerText = "%1000000";
                percentEl.classList.add("boom");
                msgEl.innerHTML = "<span style='font-size:24px; color:#ff2e63;'>SİZ EVLENMELİSİNİZ!</span><br>Sistem bu kadar aşka dayanamadı! 🔥💍";
            } else {
                // Normal Hesaplama
                let score = Math.floor(Math.random() * 101);
                let current = 0;
                let interval = setInterval(() => {
                    if (current >= score) {
                        clearInterval(interval);
                        if(score > 80) msgEl.innerText = "Mükemmel uyum! 😍";
                        else if(score > 50) msgEl.innerText = "Eh işte, idare eder. 😉";
                        else msgEl.innerText = "Zorlamayın bence.. 💀";
                    } else {
                        current++;
                        percentEl.innerText = "%" + current;
                    }
                }, 20);
            }
        }
    </script>
</body>
</html>
